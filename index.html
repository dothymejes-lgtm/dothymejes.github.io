<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorothy Mejes Portfolio</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&family=Nunito:wght@700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    /* Reset & base styles */
    * { margin:0; padding:0; box-sizing:border-box; scroll-behavior: smooth; }
    body { font-family: 'Lato', sans-serif; background-color: #FAFAFA; color: #333; }
    a { text-decoration: none; transition: 0.3s; }
    a:hover { color: #555555; }
    h1,h2,h3 { font-family: 'Montserrat', sans-serif; color: #333; }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    h2 { font-size: 2rem; margin-bottom: 1rem; }
    h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { margin-bottom: 1rem; color: #555; }

    /* Header / Hero */
    header { 
      text-align:center; 
      padding:100px 20px 60px; 
      background-color:#F7CACA; 
      color:#333;
      border-bottom:1px solid #E6E6E6; 
      border-radius:0 0 25px 25px;
    }
    header p { font-size:1.2rem; margin-top:10px; }

    /* Navigation links - black */
    nav { text-align:center; margin-top:15px; }
    nav a { 
      margin:0 15px; 
      font-weight:bold; 
      font-size:1rem; 
      color: #000000; /* black links */
      transition:0.3s; 
    }
    nav a:hover { color:#555555; } /* hover dark gray */

    /* Buttons */
    .btn { display:inline-block; padding:10px 25px; background-color:#FAFAFA; color:#333; border-radius:25px; font-weight:bold; margin:10px 5px; transition:0.3s; border:2px solid #F7CACA; }
    .btn:hover { background-color:#E6E6E6; color:#333; }

    /* Sections */
    section { padding:60px 20px; max-width:900px; margin:40px auto; border-radius:15px; }
    section:nth-child(even) { background-color:#F7F7F7; }

    /* Lists */
    .skills-list, .experience-list { list-style:none; padding-left:0; display:flex; flex-wrap:wrap; gap:10px; }
    .skills-list li, .experience-list li { background-color:#F7CACA; color:#333; padding:8px 12px; border-radius:20px; font-weight:bold; display:flex; align-items:center; }
    .skills-list li i, .experience-list li i { margin-right:8px; }

    /* Footer */
    footer { text-align:center; padding:40px 20px; background-color:#E6E6E6; color:#333; border-radius:25px 25px 0 0; }

    /* Icons */
    .icon { color: #F7CACA; margin-right: 8px; }

    /* Responsive */
    @media(max-width:600px){
      h1{ font-size:2.2rem; }
      h2{ font-size:1.7rem; }
      h3{ font-size:1.2rem; }
      .skills-list, .experience-list{ flex-direction: column; }
      nav a{ display:block; margin:10px 0; }
    }
  </style>
</head>
<body>

  <!-- Header / Hero Section -->
  <header>
    <h1>Dorothy Mejes</h1>
    <p>Licensed Professional Teacher | Admin & Accounting Support | Confident Communicator</p>
    <p>Blending professionalism, creativity, and people-centered skills across education, administration, and customer engagement.</p>
